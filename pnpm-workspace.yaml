packages:
  - apps/*
  - packages/*

allowBuilds:
  "@heroui-pro/react": true
  # Pulled in transitively by `workflow`. Both are optional native accelerators
  # with working pure-JS fallbacks, so they are declined for the same reason as
  # esbuild and sharp below.
  "@swc/core": false
  "@zowe/secrets-for-zowe-sdk": false
  cbor-extract: false
  core-js: false
  es5-ext: false
  esbuild: false
  heroui-native-pro: true
  heroui-pro: true
  msw: false
  protobufjs: false
  sharp: false

catalog:
  "@tailwindcss/postcss": ^4.3.0
  "@types/mdx": ^2.0.13
  "@types/node": 24.13.2
  "@types/react": 19.2.10
  "@types/react-dom": 19.2.3
  "@vercel/config": 0.2.1
  next: 16.3.0
  postcss: ^8.5.23
  react: 19.2.4
  react-dom: 19.2.4
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  typescript: 7.0.2

# `workflow` pulls in zod 4.3.6, and a second zod 4.x copy changes hoisting for
# @hookform/resolvers@3, which declares zod only as a loose peer — it silently
# picked up the wrong copy and broke typecheck in the Studio forms. Collapse the
# 4.x range to the version the workspace already uses. Scoped to `zod@4` so
# @vercel/config's zod 3 dependency is left alone.
overrides:
  zod@4: 4.4.3

minimumReleaseAgeStrict: true

savePrefix: ""
